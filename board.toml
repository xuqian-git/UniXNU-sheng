# Board description of the OnePlus Pad 2 Pro (erhai, OPD2413, SM8750), read by the unixnu build driver.
#
# This is the erhai branch of a UniXNU-sheng fork: the sheng package (package/, kits/sheng in the build tree) is shared
# unchanged, and this file, configs/erhai_defconfig, drivers/NativeUfs and the erhai scripts carry the board.
#
# Hardware values measured on this unit (adb, /proc/iomem, NativeUfs probes):
#   FD base/size  0xA7000000 / 0x2A8000   (stock uefi_a ELF PT_LOAD)
#   splash_region 0xFC800000 + 0x2B00000  (live DT /reserved-memory/splash_region)
#   GICD / GICR   0x16000000 / 0x16080000 (stride 0x40000), timebase 19.2 MHz
#   panel         3392x2400 video mode;   touch novatek,nf_nt36536;   UFS 0x1d84000

[board]
name = "erhai"
soc = "SM8750"
description = "OnePlus Pad 2 Pro"
kit = "sheng"                      # the shared sheng package/ appears as kits/sheng in the build tree

# The same unchanged iPad7,1 iPadOS 17.7.11 restore image as sheng.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]   # the small components

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The GPT entry "userdata" of LUN 0 (sda15), read by NativeUfs on this unit.
[userdata]
first_lba = 0x3798e8
last_lba = 0x3adb7fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "erhai_defconfig"
# sheng's list without the Adreno builders (no Adreno 830 support). NativeUfs is drivers/NativeUfs of this branch.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-arm-driver.py NativeUfs",
  "build-arm-driver.py NativeVirtioBlock",
  "build-arm-driver.py NativeRamBlock",
  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  "build-native-virtio-bindings.py --component NativeVirtioBlock",
  "build-mockfs-fixture.py",
  "build-sheng-platform-power.py",
  "build-boot-progress.py",
  "build-libpthread-kernel.py",
  "build-native-legacy-display.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The local UEFI-erhai checkout (Mu-Silicium with erhaiPkg). It is not published: it carries binaries extracted from
# this unit's stock firmware.
[firmware]
config = "erhai"
dsc = "Platforms/OnePlus/erhaiPkg/erhai.dsc"
fd = "Build/erhaiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "erhai"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "erhai-research"

# The OnePlus ABL replaces the ramdisk field during "fastboot boot", so the payload rides in the kernel field after the
# firmware volume (scripts/package-erhai-boot.py; BootShim is built with EMBEDDED_PAYLOAD_SIZE).
[payload]
volume = "ERHAIESP"
size_mib = 192
loader = "firmware"
title = "Boot"
dram_size = "0x80000000"
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
panic_screen = true
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# sheng's command line, with erhai's differences:
#   serial=0            no UART backend on this board (serial=3 panicked in pmap_map_bd during kprintf setup)
#   kt_fixed_zones=240  120 trips the kalloc type-zone assert on this build (measured on the device)
#   cpus=1              secondary cores are not brought up on SM8750 yet
#   native-ufs-smmu=2   the UFS stream is behind the hypervisor: an identity stage-1 context, not a bypass bank
# Not yet ported (sheng hardware): touch, buttons, backlight, Wi-Fi, CPU frequency, GPU and Metal, AKS, SMP.
kernel_args = [
  "-v",
  "serial=0",
  "debug=0x14e",
  "kt_fixed_zones=240",
  "cpus=1",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-legacy-phase=4",
  "offline-mobile-graphics-load=1",
  "offline-apfs-load=1",
  "boot-progress=2",
  "-apfs_shared_datavolume",
  "native-ufs-root=1",
  "native-ufs-smmu=2",
  "native-ufs-diagnostics=1",
  "sheng-pmgr=2",
  "armcpu-diagnostics=1",
  "sheng-disable-watchdogd=1",
  "sheng-lite=1",
  "boot-ui-focus4=SpringBoard",
  "sheng-banner=0",
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "sheng-fb-diff=1",
]

# Fixups of signed text, applied by the kernel after signature validation (patches/xnu/native-text-fixup.patch). They are
# properties of the shared 21H461 image, so they are sheng's; see UniXNU-sheng board.toml for each one's analysis.
text_fixups = [
  # +[AWAttentionAwarenessConfiguration initialize] deadlocks SpringBoard startup against +[AWClientPreferences initialize].
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  # PosterBoardServices requires NSFileProtectionNone, which a Data volume without data protection never reports.
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  # BTAudioHALPlugin reconnects to the missing com.apple.BTAudioHALPlugin.xpc in a tight loop with bluetoothd disabled.
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
tool = "scripts/make-erhai-adt.py"
chip_id = "207"
# 4 GiB in the high DRAM bank that erhaiPkg gives UEFI (0x8C0000000 + 5 GiB): nothing below 4 GiB is big enough.
owned_memory_size = "0x100000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0"                     # one core, matching cpus=1
packed_data_ramdisk = true         # a volatile RAM Data volume for now (sheng: persistent Data on UFS)
ipad_identity = true
unique_chip_id = "required"        # the platform seed is not stored in any repository

# The stock ABL powers the panel off when the device tree has no splash region, so add it.
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xfc800000", "0x0", "0x2b00000"] },
]
